<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Low-Poly Wireframe Face Portrait</title>
    <style>
      :root {
        --bg-page: #19181c;
        --card-bg: rgba(36, 35, 40, 0.75);
        --border-color: rgba(255, 255, 255, 0.08);
        --text-primary: #ededed;
        --text-secondary: #9f9da6;
        --accent-purple: #794d8f;
        --accent-glow: rgba(121, 77, 143, 0.35);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--bg-page);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 32px 16px 48px;
        background-image: 
          radial-gradient(circle at 50% 10%, rgba(90, 58, 106, 0.22) 0%, transparent 60%),
          radial-gradient(circle at 80% 80%, rgba(50, 48, 60, 0.3) 0%, transparent 50%);
      }

      header {
        text-align: center;
        margin-bottom: 24px;
      }

      h1 {
        font-size: 1.6rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin-bottom: 8px;
        background: linear-gradient(135deg, #ffffff 40%, #c4a9d8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      p.subtitle {
        color: var(--text-secondary);
        font-size: 0.88rem;
        max-width: 540px;
        line-height: 1.4;
      }

      .main-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .canvas-wrapper {
        position: relative;
        background: #2F2E33;
        border-radius: 6px;
        overflow: hidden;
        box-shadow: 
          0 10px 30px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.08),
          0 0 45px rgba(90, 58, 106, 0.18);
        line-height: 0;
      }

      canvas {
        display: block;
        width: 615px;
        height: 773px;
      }

      .control-panel {
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 12px 20px;
        display: flex;
        align-items: center;
        gap: 18px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      }

      .control-group {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.85rem;
        color: var(--text-secondary);
      }

      .control-group label {
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--text-primary);
        font-weight: 500;
      }

      input[type="checkbox"] {
        accent-color: var(--accent-purple);
        width: 16px;
        height: 16px;
        cursor: pointer;
      }

      input[type="number"] {
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid var(--border-color);
        color: #fff;
        padding: 6px 10px;
        border-radius: 6px;
        width: 65px;
        font-size: 0.85rem;
        text-align: center;
      }

      input[type="number"]:focus {
        outline: none;
        border-color: var(--accent-purple);
      }

      button {
        background: linear-gradient(135deg, #5A3A6A 0%, #3f274a 100%);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 8px 16px;
        font-size: 0.85rem;
        font-weight: 500;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      button:hover {
        background: linear-gradient(135deg, #6a447c 0%, #4a2e58 100%);
        box-shadow: 0 0 12px var(--accent-glow);
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
      }

      .badge {
        font-size: 0.75rem;
        padding: 3px 8px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 20px;
        color: #a8a5b2;
      }

      .status {
        color: #b5adc0;
        font-family: monospace;
        font-size: 0.8rem;
      }

      /* Print Styles for Direct Printing */
      @media print {
        @page {
          size: portrait;
          margin: 0.5cm;
        }

        body {
          background: #ffffff !important;
          background-image: none !important;
          color: #000000 !important;
          padding: 0 !important;
          margin: 0 !important;
          display: flex !important;
          align-items: center !important;
          justify-content: center !important;
        }

        header,
        .control-panel,
        .subtitle,
        .badge {
          display: none !important;
        }

        .main-container {
          gap: 0 !important;
          margin: 0 !important;
          padding: 0 !important;
        }

        .canvas-wrapper {
          box-shadow: none !important;
          border-radius: 0 !important;
          overflow: visible !important;
          margin: auto !important;
        }

        canvas {
          max-width: 100% !important;
          height: auto !important;
          page-break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Geometric Wireframe Face Reconstruction</h1>
      <p class="subtitle">
        Procedurally synthesized 3/4 low-poly mesh portrait with seeded Mulberry32 triangulation,
        dense facial features, and gradient dissolution.
      </p>
    </header>

    <div class="main-container">
      <div class="control-panel">
        <div class="control-group">
          <label for="animateToggle">
            <input type="checkbox" id="animateToggle" />
            Animate Build
          </label>
        </div>

        <div class="control-group">
          <label for="autoPrintToggle">
            <input type="checkbox" id="autoPrintToggle" checked />
            Direct Print When Done
          </label>
        </div>

        <div class="control-group">
          <span>Seed:</span>
          <input type="number" id="seedInput" value="7" />
        </div>

        <button id="redrawBtn">Re-render</button>
        <button id="printBtn">🖨️ Print Now</button>
        <button id="downloadBtn">Export PNG</button>
        <span class="status" id="statusText">Ready</span>
        <span class="badge">615 × 773 px</span>
      </div>

      <div class="canvas-wrapper">
        <canvas id="faceCanvas" width="615" height="773"></canvas>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
